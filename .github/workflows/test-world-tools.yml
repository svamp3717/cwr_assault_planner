name: Test mission porting tools

on:
  push:
    branches: [world-config-portability]
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "cwr_assault_planner_v203.eden/randomize.sqs"
      - "cwr_assault_planner_v203.eden/worldConfig.sqs"
      - "cwr_assault_planner_v203.eden/init.sqs"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m compileall -q tools tests
