name: Test mission porting tools

on:
  push:
    branches: [world-config-portability]
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - "cwr_assault_planner_v203.eden/**"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install virtual display for Tkinter tests
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth
      - name: Run unit tests (including Tkinter map editor)
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Compile Python tools
        run: python -m compileall -q tools tests
