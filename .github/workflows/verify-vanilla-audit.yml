name: Verify vanilla export dependencies
on:
  push:
    branches: [asset-profile-refactor-stage]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit actual exported mission
        run: python tools/_audit_vanilla.py
      - name: Test real mission exports
        run: python -m unittest discover -s tests -p test_asset_packs.py -v
